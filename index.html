<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь креатора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F3FA; --card:#FFFFFF; --ink:#16142B; --muted:#6B678C; --line:rgba(22,20,43,.12);
  --acc:#6C4DF6; --acc2:#F25C9A; --ok:#12B37D; --warn:#E8A020; --bad:#E04A5F;
  --shadow:0 2px 10px rgba(22,20,43,.07);
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E1E; --card:#1A1930; --ink:#EFEDFB; --muted:#A29EC4; --line:rgba(239,237,251,.14);
  --acc:#8E7BFF; --acc2:#FF6FA8; --ok:#2ED89B; --shadow:0 2px 14px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--bg:#0F0E1E;--card:#1A1930;--ink:#EFEDFB;--muted:#A29EC4;--line:rgba(239,237,251,.14);--acc:#8E7BFF;--acc2:#FF6FA8;--ok:#2ED89B}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 220px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* старт */
.hero{padding:16px 2px 8px}
.kick{font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.02em}
h1{font-size:clamp(32px,9vw,44px);font-weight:800;line-height:.95;letter-spacing:-.03em;margin:8px 0 10px}
.hero p{color:var(--muted);max-width:34ch;margin:0 0 6px;font-size:14px}
.arch{display:grid;gap:8px;margin-top:6px;padding-bottom:16px}
.archBtn{display:grid;grid-template-columns:42px 1fr;gap:1px 11px;align-items:center;text-align:left;padding:11px 13px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.archBtn .em{font-size:26px;grid-row:span 2}
.archBtn b{font-size:16px;font-weight:800}
.archBtn small{color:var(--muted);font-size:12.5px;line-height:1.35}
.wide{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;margin-top:14px}
.wide.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* шапка */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dayN{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dayN i{font-style:normal;font-size:14px;color:var(--muted);font-weight:600}
.hd .who{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);font-weight:600}
.hd .who b{display:block;font-size:14px;color:var(--ink)}
.goal{padding:12px 14px;margin-bottom:10px}
.goal .r{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;gap:10px}
.goal .r span:last-child{color:var(--muted)}
.trk{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.trk i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px;transition:width .35s}
.wkc{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:10px;border-left:3px solid var(--acc)}
.wkc .em{font-size:22px}
.wkc b{font-size:14px}
.wkc p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.m{padding:9px 11px}
.m .r{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.m .r span:last-child{color:var(--muted)}
.m .trk{height:5px;margin-top:6px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.n{padding:9px 6px;text-align:center}
.n b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.n span{font-size:11px;color:var(--muted);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.tag.bad{color:var(--bad);border-color:currentColor}
.tag.ok{color:var(--ok);border-color:currentColor}
.feed{padding:2px 14px;margin-bottom:12px}
.feed p{margin:0;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--muted)}
.feed p:last-child{border-bottom:0}
.feed p:first-child{color:var(--ink);font-weight:600}

/* действия */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.dock .inner{max-width:520px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs{align-items:center}
.tabs button{flex:1;padding:8px 2px;font-size:12.5px;font-weight:600;border-radius:10px;color:var(--muted)}
.tabs .restB{flex:0 0 auto;padding:8px 11px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.act{padding:9px 3px 7px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:88px;transition:transform .1s}
.act .g{font-size:10.5px;font-weight:600;color:var(--acc)}
.act.p .g{color:#fff;opacity:.9}
.act:active:not(:disabled){transform:scale(.96)}
.act .e{font-size:21px}
.act .t{font-size:11px;font-weight:600;text-align:center;line-height:1.1}
.act .c{font-size:10.5px;color:var(--muted)}
.act:disabled{opacity:.35}
.act.p{background:var(--acc);border-color:transparent;color:#fff}
.act.p .c{color:rgba(255,255,255,.75)}
.menu{display:flex;gap:6px;margin-top:8px}
.menu button{flex:1;padding:9px 2px;font-size:12px;font-weight:600;border-radius:11px;background:var(--card);border:1px solid var(--line)}

/* модалки */
.ov{position:fixed;inset:0;background:rgba(12,10,28,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.mo{background:var(--card);border-radius:20px;max-width:400px;width:100%;padding:22px 18px 16px;max-height:88vh;overflow:auto;animation:pop .2s ease-out;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mo .em{font-size:40px;line-height:1}
.mo .kick{margin:8px 0 2px}
.mo h3{font-size:19px;font-weight:800;margin:4px 0 8px;line-height:1.2}
.mo p{margin:0 0 16px;color:var(--muted)}
.mo .btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--acc);color:#fff;font-weight:600;margin-bottom:8px;text-align:center}
.mo .btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sheet{align-items:flex-end;padding:0}
.sheet .mo{max-width:520px;border-radius:20px 20px 0 0;max-height:84vh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.mo h4{font-size:16px;font-weight:800;margin:16px 0 8px}
.it{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.it .h{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.it .h em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
.it .d{font-size:13px;color:var(--muted);margin:4px 0 0}
.it .btn{margin:10px 0 0;padding:9px;font-size:13.5px}
.it.on{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.grid2 div{border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.grid2 b{display:block;font-size:16px;font-weight:800}
.grid2 span{font-size:11.5px;color:var(--muted)}
.toast{position:absolute;right:8px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:5;max-width:56%;text-align:left;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:pop .2s ease-out}
.thought{background:var(--bg);border-radius:14px;padding:12px 14px;margin:-4px 0 16px;font-size:14px;line-height:1.45}
.thought b{display:block;font-size:12.5px;color:var(--acc);margin-bottom:4px}
.m,.n{cursor:pointer}

/* новые блоки */
.rival{padding:10px 13px;margin-bottom:10px}
.rv{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.rv span:last-child{color:var(--muted)}
.rvTrk{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:7px 0 5px;position:relative}
.rvTrk i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px;transition:width .4s}
.rvN{font-size:11.5px;color:var(--muted)}
.quests{padding:11px 13px;margin-bottom:10px}
.qH{font-size:12px;font-weight:800;color:var(--acc);margin-bottom:7px;letter-spacing:.02em}
.qRow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.qBox{width:17px;height:17px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex:0 0 auto}
.qRow.ok .qBox{background:var(--ok);border-color:var(--ok)}
.qRow.ok .qT{color:var(--muted);text-decoration:line-through}
.qT{flex:1}
.qN{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.post{padding:14px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.post.vir{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.pHead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.pAv{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:19px}
.pHead b{display:block;font-size:13.5px}
.pHead i{font-style:normal;font-size:11.5px;color:var(--muted)}
.pQ{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.pTitle{font-size:15.5px;font-weight:600;line-height:1.3;margin-bottom:10px}
.pViews{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.pViews b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pViews span{font-size:12.5px;color:var(--muted)}
.pStats{display:flex;gap:12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:8px}
.pC{font-size:12.5px;color:var(--muted);padding:3px 0}
.pC b{color:var(--ink);font-weight:600}
/* выбор подачи */
.mo.pick{max-width:430px}
.hk{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;background:var(--bg)}
.hk:active:not(:disabled){transform:scale(.99)}
.hk:disabled{opacity:.4}
.hkTop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hkTop b{font-size:14px;font-weight:600;line-height:1.25}
.hkTop i{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.hkD{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.hkTags{display:block;margin-top:6px}
.hkTags i{font-style:normal;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-right:5px;display:inline-block}
.hkTags .t1{background:color-mix(in srgb,var(--acc2) 20%,transparent);color:var(--acc2)}
.hkTags .t2{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.hkTags .t3{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.hkTags .t4{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
/* старт: имя */
.nameBox{padding:14px;margin-bottom:12px}
.nameBox label{font-size:12px;font-weight:700;color:var(--muted)}
.nameBox input{width:100%;margin-top:6px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sg{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:5px 10px;color:var(--muted)}
/* финальный постер */
.poster{border-radius:18px;padding:18px;background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;margin-bottom:14px}
.poster .pk{font-size:11.5px;font-weight:700;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.poster h4{font-size:21px;margin:6px 0 2px;color:#fff}
.poster .pb{font-size:13px;opacity:.9;margin-bottom:12px}
.pGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pGrid div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.pGrid b{display:block;font-size:17px;font-weight:800}
.pGrid span{font-size:11px;opacity:.85}
.poster svg{display:block;width:100%;height:54px;margin-bottom:10px}
.poster .pf{font-size:12px;opacity:.9;line-height:1.4}

/* ==== компактный одноэкранный режим ==== */
html,body{height:100%;overflow:hidden}
.wrap{max-width:520px;margin:0 auto;padding:8px 12px 0;height:100%;display:flex;flex-direction:column;overflow:hidden}
#start{flex:1;min-height:0;overflow-y:auto;padding-bottom:30px}
#game{display:flex;flex-direction:column;flex:1;min-height:0;padding-bottom:calc(166px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bDay{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.bDay i{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.bGoal{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px 9px}
.bGoal .g1{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;gap:6px}
.bGoal .g1 span:last-child{color:var(--muted)}
.bGoal .trk{height:4px;margin-top:4px}
.bMoney{font-size:13px;font-weight:800;white-space:nowrap;text-align:right}
.bMoney i{display:block;font-style:normal;font-size:10px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:7px;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.bad{color:var(--bad);border-color:currentColor}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.acc{color:var(--acc);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.chip.hot{background:var(--acc);color:#fff;border-color:transparent}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.mm{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 9px}
.mm .t{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;gap:6px}
.mm .t b{font-weight:800}
.mm .t span{color:var(--muted)}
.mm .trk{height:4px;margin-top:4px}
.numline{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:600;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;color:var(--muted)}
.numline span{color:var(--muted);font-weight:600}
.numline b{font-weight:800;color:var(--ink);font-size:13px}
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stage::-webkit-scrollbar{display:none}
.post{padding:12px;margin-bottom:8px;position:relative}
.pHead{margin-bottom:7px}
.pAv{width:32px;height:32px;border-radius:10px;font-size:17px}
.pTitle{font-size:14.5px;margin-bottom:7px}
.pViews b{font-size:26px}
.pStats{padding-bottom:7px;margin-bottom:6px}
.miniFeed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 11px;margin-bottom:8px}
.miniFeed p{margin:0;padding:6px 0;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.miniFeed p:last-child{border-bottom:0}
.miniFeed p:first-child{color:var(--ink);font-weight:600}
.dock{padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px))}
.tabs{margin-bottom:6px}
.acts{gap:6px}
.act{min-height:70px;padding:7px 3px 6px}
.act .e{font-size:19px}
.menu{margin-top:6px;gap:5px}
.menu button{padding:7px 2px;font-size:11.5px}
.stage{position:relative}

.startBtns{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:4px 0 12px}
.sBtn{text-align:left;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.sBtn small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.sBtn.ch{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.sBtn.ch small{color:rgba(255,255,255,.85)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.shk{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.glw .chip{animation:glw 1.2s}
@keyframes glw{30%{box-shadow:0 0 0 3px var(--ok)}}

.coachT{position:relative;outline:3px solid var(--acc2);outline-offset:3px;border-radius:14px;animation:cpulse 1.4s infinite}
@keyframes cpulse{50%{outline-color:transparent}}
#coach{position:fixed;left:12px;right:12px;max-width:500px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .2s ease-out}
#coach .cT{font-size:13.5px;font-weight:600;line-height:1.4}
#coach .cB{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
#coach .cB button{font-size:12px;color:var(--bg);opacity:.7}
#coach .cB .cN{opacity:1;background:var(--acc);color:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
body{padding-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.dock{padding-bottom:calc(7px + var(--tg-safe-area-inset-bottom,0px) + env(safe-area-inset-bottom,0px))}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap">
  <section id="start">
    <div class="hero">
      <div class="kick">Симулятор блогера · 200 дней</div>
      <h1>Путь креатора</h1>
      <p>Рилсы, охваты, выгорание, друзья с репостами, странные продюсеры и кредит на продвижение.</p>

function worldRand(){if(!S||!S.challenge)return Math.random();const r=mulberry(S.wr)();S.wr=(S.wr+0x6D2B79F5)|0;return r}

function weekKey(){return Math.max(1,Math.floor((Date.now()-Date.UTC(2026,0,5))/(7*864e5))+1)}
function challengeSetup(){
 const k=weekKey(),r=mulberry(k*7919);
 const fams=Object.keys(FAM),fam=fams[Math.floor(r()*fams.length)];
 const ns=NICHE[fam],nc=ns[Math.floor(r()*(ns.length-1))].id;
 const sts=Object.keys(STORIES),st=sts[1+Math.floor(r()*(sts.length-1))];
 const trs=Object.keys(TRAITS),trt=trs[Math.floor(r()*trs.length)];
 return {k,fam,nc,st,trt};
}

const TG=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData!==undefined)?Telegram.WebApp:null;

}
function tgBack(){
 if(document.querySelector('#sheet')){closeSheet();tgBackSync();return}
 const p=document.querySelector('[data-p="x"]');if(p){p.click();tgBackSync();return}
 tgBackSync();
}
function tgBackSync(){try{if(!TG||!tgv('6.1'))return;(document.querySelector('#sheet')||document.querySelector('[data-p="x"]'))?TG.BackButton.show():TG.BackButton.hide()}catch(e){}}
function haptic(kind){
 try{
  if(TG&&tgv('6.1')){const H=TG.HapticFeedback;
   if(kind==='success')H.notificationOccurred('success');
   else if(kind==='error')H.notificationOccurred('error');
   else if(kind==='heavy')H.impactOccurred('heavy');
   else H.selectionChanged();return}
  if(navigator.vibrate)navigator.vibrate(kind==='success'?[30,40,60]:kind==='heavy'||kind==='error'?80:8);
 }catch(e){}
}
/* облачные сохранения: CloudStorage хранит строки до 4096 символов, режем на куски */
function cloudOk(){return TG&&tgv('6.9')&&TG.CloudStorage}
function cloudSet(key,str){
 if(!cloudOk())return;
 try{const n=Math.ceil(str.length/3800)||1;
  for(let i=0;i<n;i++)TG.CloudStorage.setItem(key+'_'+i,str.slice(i*3800,(i+1)*3800),()=>{});
  TG.CloudStorage.setItem(key+'_n',String(n),()=>{});
 }catch(e){}
}
function cloudGet(key,cb){
 if(!cloudOk())return cb(null);
 try{TG.CloudStorage.getItem(key+'_n',(err,n)=>{
  n=+n||0;if(err||!n)return cb(null);
  const keys=[...Array(n).keys()].map(i=>key+'_'+i);
  TG.CloudStorage.getItems(keys,(e2,vals)=>{if(e2||!vals)return cb(null);cb(keys.map(k=>vals[k]||'').join(''))});
 })}catch(e){cb(null)}
}
function cloudDel(key){if(!cloudOk())return;try{TG.CloudStorage.setItem(key+'_n','0',()=>{})}catch(e){}}

function doReel(k,card){
 const s=S,w=wk(),p=s.prod,T=TYPES[k];
 card=card||{q:0,reach:1,viral:1,trust:0,heat:0};
 const t=tr();
 let q=s.skill*.55+s.prep*9+(s.team.reels?15:0)+(s.team.script?14:0)+(p?p.q:0)+gearQ()+rnd(-12,12)+s.nextQ+(card.q||0)+(t.q||0)+(k==='expert'?(t.expQ||0):0)+(card.rq?ri(card.rq[0],card.rq[1]):0);
 if(s.energy<35)q-=15;
 q=clamp(Math.round(q),3,100);
 const gap=s.lastPost?s.day-s.lastPost:3;
 let cons=1;
 if(gap===1&&q<45){cons=.75;if(s.streak>=5)unlock('daily')}
 if(s.lastPost&&gap>7){cons=.55;unlock('gap')}
 const total=s.live+s.dead, health=total?Math.sqrt(s.live/total):1;
 const reachBase=s.live<=3000?s.live*.35:1050+Math.pow(s.live-3000,.75)*1.2;
 const base=(250+reachBase)*health;
 const spread=w.chaos?rnd(.25,2.6):rnd(.6,1.5);
 const fl=s.flags,fm2=(fl.satur&&s.day<fl.satur?.85:1)*(fl.igLow&&s.day<fl.igLow?.5:1)*(fl.aiFlood&&card.id!=='story'?.85:1)*(fl.algoLong&&s.day<fl.algoLong?(k==='wide'?.7:k==='car'?1.3:1):1);
 let views=base*fm2*(.4+q/45)*T.reach*A().reach*(card.reach||1)*(k==='wide'?(t.wide||1):1)*(w.reach||1)*cons*(s.shadow>0?.15:1)*s.nextMult*spread;
 let vc=(Math.max(0,q-25)/300*T.viral)*(card.viral||1)+(s.team.script?.02:0)+(p?p.viral:0)+(S.fam==='art'?.02:0);
 vc*=(w.viral||1); if(s.shadow>0)vc=0;
 let viral=false;
 if(Math.random()<vc){viral=true;views*=Math.random()<.1?rnd(80,200):rnd(12,50)}
 views=Math.round(views);
 let rate=(.006+q/2500)*T.fol*A().fm*(story().fm||1)*(k==='expert'?(w.expert||1):1);
 let gain=Math.round(views*rate/(1+views/700000));
 const coldShare=k==='wide'?.35:k==='sell'?.12:k==='car'?.06:.05;
 s.cold=(s.cold||0)+Math.round(gain*coldShare);
 s.live+=gain;s.views+=views;s.reels++;s.best=Math.max(s.best,views);
 s.streak=gap===1?s.streak+1:1;
 s.burn+=((gap===1?13:6)-(s.team.reels?3:0))*(s.flags.chair?.8:1)*(t.burnUp||1);
 s.trust=clamp(s.trust+(T.trust+(card.trust||0))*A().tr*(t.tr||1)*(1-s.trust/120),0,100);
 s.heat=clamp(s.heat+T.heat+(card.heat||0),0,100);
 if(k==='sell'){s.sellStreak++;if(s.sellStreak>=3){s.trust=Math.max(0,s.trust-4);const l=Math.round(s.live*.01);s.live-=l;log(`😵 Третий продающий подряд: ${l} человек отписались.`);unlock('fatigue')}}else s.sellStreak=0;
 if(k==='car')s.mot+=gain>=25?3:-1;
 else if(k==='sell')s.mot-=1;
 else if(views<300)s.mot-=s.reels<15?2:4;else if(views<1500)s.mot-=1;else if(views<5000)s.mot+=2;else s.mot+=8;
 if(viral)s.mot+=25;
 s.prep=0;s.nextQ=0;s.nextMult=1;s.lastPost=s.day;
 s.q[k==='car'?'car':k]++;s.q.posts++;s.q.subs+=gain;
 monthTrack(k,card.title||T.t,views,q);if(viral)fx('confetti');
 const likes=Math.round(views*rnd(.03,.07)),saves=Math.round(views*(k==='car'?rnd(.02,.05):rnd(.004,.012)));
 s.post={type:k,title:card.title||T.t,views,gain,likes,saves,q,viral,
  cmts:makeComments(k,views,gain,card),tip:card.tip||''};
 log(`${T.e} ${card.title||T.t}: ${fmt(views)} просмотров, +${fmt(gain)} подписчиков, ${fmt(saves)} сохранений. Качество ${q}/100.${s.shadow>0?' Теневой бан режет охваты.':''}`);
 if(viral){s.virals=(s.virals||0)+1;}
 if(viral&&s.virals>2)toast(`🚀 Залетело: ${fmt(views)} просмотров, +${fmt(gain)} подписчиков`,3000);
 if(viral&&s.virals<=2){msg('🚀','Рилс залетел!',`${fmt(views)} просмотров и +${fmt(gain)} подписчиков. Родственники переслали его в семейный чат.`);unlock('viral')}
 if(s.reels===1&&views<700)unlock('first');
 if(s.reels===6)unlock('mix');
 if(q>=70)unlock('hook');
 if(s.team.reels&&!s.team.script&&!p&&s.reels>2)unlock('reelsmaker');
 if(s.streak===30){s.mot+=15;msg('📆','Челлендж «30 дней» выполнен','Вы выкладывали рилсы 30 дней подряд. Мотивация +15. Теперь главное — не выгореть.');unlock('streak')}
}
function makeComments(k,views,gain,card){
 const n=nd(),out=[],used=[];
 const pool=views<800?CMT.flop:views>20000?CMT.hit:CMT.mid;
 out.push(pick(pool));
 if(k==='sell')out.push(pick(CMT.sell));
 else if(card&&card.hate)out.push(pick(CMT.hate));
 else out.push(pick(n.c));
 if(views>3000&&Math.random()<.6)out.push(pick(n.c.concat(CMT.mid)));
 return [...new Set(out)].slice(0,3).map(c=>({n:pick(NAMES.filter(x=>!used.includes(x))||NAMES)||'гость',c}))
  .map(o=>{used.push(o.n);return o});
}

 }else{

  let b=s.live*a.conv*(s.trust/60)*heatM*astro*satM*pen*(s.team.funnel?2:1)*(p?p.sales:1)*(w.sales||1)*rnd(.5,1.5)*(recent?.35:1);

  rev=Math.round(gross*(1-a.cost-(s.flags.costUp||0)));
 }
 const share=p?Math.round(rev*p.share):0,net=rev-share;
 s.money+=net;s.revenue+=net;s.sales+=buyers;s.lastSale=s.day;s.sat=(s.sat||0)+buyers;
 if(s.heat<25&&net<=a.price)unlock('heat');
 s.heat=Math.round(s.heat*.2);
 if(recent){s.trust=Math.max(0,s.trust-6);s.live-=Math.round(s.live*.02);unlock('fatigue')}
 s.mot+=net>0?Math.min(20,Math.round(net/20000)+3):-10;
 if(s.fam==='art')log(`💰 ${tierOf(s.tier).n}: +${fmt(net)} ₽${share?` (продюсеру ${fmt(share)} ₽)`:''}.`);

function rollQuests(){const p=[...QUESTS].sort(()=>Math.random()-.5).slice(0,3);return p.map(x=>x.id)}
function questList(){return S.quests.map(id=>QUESTS.find(x=>x.id===id)).filter(Boolean)}
function checkQuests(){
 const s=S;let all=true;
 questList().forEach(q=>{if(q.g(s)<q.n)all=false});
 if(all&&!s.qdone.includes(s.day+'w')&&questList().length){
  s.qdone.push(s.day+'w');
  let txt=[];
  questList().forEach(q=>{const m=q.m;
   if(m.money){s.money+=m.money;txt.push(`+${fmt(m.money)} ₽`)}
   if(m.mot){s.mot+=m.mot;txt.push(`+${m.mot} мотивации`)}
   if(m.skill){s.skill=Math.min(100,s.skill+m.skill);txt.push(`+${m.skill} навыка`)}
   if(m.trust){s.trust=Math.min(100,s.trust+m.trust);txt.push(`+${m.trust} доверия`)}});
  const bonus=30000+Math.round(s.day*400);
  s.money+=bonus;s.mot=Math.min(100,s.mot+12);
  log(`✅ Все задания недели закрыты: ${txt.join(', ')}, бонус ${fmt(bonus)} ₽ и +12 мотивации.`);
  toast(`✅ Задания недели закрыты: +${fmt(bonus)} ₽ и +12 мотивации`,3200);fx('glow');
 }
}

function randomEvent(){
 const s=S;
 const pool=EV.filter(e=>{
  if(e.nc&&!e.nc.includes(s.niche))return false;
  if(e.hard&&!DIFF[s.diff].hard&&!s.hc)return false;
  if(e.hc&&!s.hc)return false;
  if(e.late&&s.day<100&&s.revenue<1000000)return false;
  if(e.st&&!e.st.includes(s.story))return false;
  if(e.notEasy&&s.diff==='easy')return false;
  if(e.c&&!e.c(s))return false;
  const last=s.seen[e.id];
  if(e.once)return !last;
  return !last||s.day-last>=(e.cd||25);
 });
 if(!pool.length)return;
 const e=pickW(pool);s.seen[e.id]=s.day;s.lastEv=s.day;
 const r=e.r(s);
 if(e.choice)msg(r[0],r[1],r[2],r[3]);
 else{msg(r[0],r[1],r[2]);log(`${r[0]} ${r[1]}.`)}
}

function offerHC(reason){
 const s=S;s.hcOffered=1;
 queue.push({e:'🌋',t:'Добьём до года?',d:`${reason} Можно остановиться здесь — или продолжить до 365-го дня в режиме выживания: жизнь на 30% дороже, события в два раза чаще и жёстче — налоговые проверки, уход команды, блокировки, кризисы. Финальная планка: ${goalLabel(GOALS[s.fam][3])}.`,

           {l:'Закончить на этом',f:()=>{end(s.won>=3?'legend':s.won>=1?'win':'time')}}]});
}
function endCheck(){if(S.over)return;
 if(goalVal()>=goalNow()){
  if(!S.won)S.wonDay=Math.min(S.day,S.maxDays);
  S.won++;
  if(S.hc&&S.won>=4)return end('legend2');
  if(S.won>=3&&!S.hc){if(!S.hcOffered)return offerHC(`Три планки взяты на ${S.day}-й день.`);return}
  const left=Math.max(S.maxDays,250)-S.day;
  const next=GOALS[S.fam][Math.min(S.won,3)];
  queue.push({e:'🏆',t:`Цель достигнута на ${S.day}-й день`,
   d:`Вы дошли до отметки ${goalLabel(GOALS[S.fam][S.won-1])}. В запасе ещё ${Math.max(0,left)} дней. Можно закрыть игру с этим результатом — или поднять планку.`,
   choices:[{l:`Поднять планку: ${goalLabel(next)}`,f:()=>{S.mot=Math.min(100,S.mot+15);if(!S.hc)S.maxDays=Math.max(S.maxDays,250);log(`🏆 Новая цель: ${goalLabel(next)}. Срок: до ${S.maxDays}-го дня.`)}},
            {l:'Закончить на этом результате',f:()=>{end('win')}}]});
  return;
 }
 if(S.mot<=0)return end('quit');
 if(S.money<-150000)return end(S.hc?'hcbroke':'broke');
 if(S.day>S.maxDays){
  if(!S.hc&&!S.hcOffered&&(S.won>=1||S.maxDays>=250))return offerHC(`Прошло ${S.maxDays} дней.`);
  if(!S.hc&&S.hcOffered)return;
  return end(S.hc?(S.won>=1?'hcsurvive':'hctime'):(S.won>=1?'win':'time'));
 }}

  else if(b.dataset.l==='dream100')saveDream(100000);
  else if(b.dataset.l==='dreamall')saveDream(S.dream.goal-S.dream.saved);
  else if(b.dataset.l==='mortoff'){if(S.money>=S.mort.left){S.money-=S.mort.left;S.mort=null;S.mot=Math.min(100,S.mot+20);log('🏦 Ипотека закрыта досрочно.');save();reopen('money');render()}}
  else if(b.dataset.m2){const[n,pr,mn]=b.dataset.m2.split('|');takeMort(n,+pr,+mn)}
  else if(b.dataset.t!==undefined){S.tier=+b.dataset.t;log(`🪜 Перешли на ступень: ${tierOf(S.tier).n}.`);unlock('ladder');save();reopen('offer');render();flush()}};
 document.body.appendChild(el);
 setTimeout(tgBackSync,0);
}
function closeSheet(){const el=$('#sheet');if(el)el.remove();setTimeout(drainToasts,60);setTimeout(tgBackSync,0)}



/* ====== ОБУЧЕНИЕ ====== */
const TUT=[
 {sel:'[data-act="r_expert"]',t:'Начнём с первого ролика. Экспертный даёт подписчиков и доверие — нажмите на него.',w:'click'},
 {sel:'.hk',t:'Выберите подачу. У каждой свой риск: безопасная — стабильно, провокация — охват и споры, личная история — доверие.',w:'click'},
 {sel:'#stageEl .post',t:'Вот результат: просмотры, прирост подписчиков и комментарии. Первые ролики почти всегда слабые — это нормально.',w:'next'},
 {sel:'#metersEl',t:'Энергия тратится на каждое действие, выгорание копится без отдыха, прогрев нужен для продаж. Нажмите на любую шкалу — расскажу подробнее.',w:'next'},
 {sel:'[data-tab="growth"]',t:'Во вкладке «Подготовка» есть сценарий: он усиливает следующий ролик. Откройте её.',w:'click'},
 {sel:'[data-act="prep"]',t:'Проработайте сценарий. Четыре подряд — максимум качества, чип станет зелёным.',w:'click'},
 {sel:'.restB',t:'Отдых всегда здесь, справа. Когда энергии меньше 35, ролики получаются хуже.',w:'next'},
 {sel:'#chipsEl',t:'Сверху — неделя от астрологов, задания и ваш конкурент. Нажмите на чип, чтобы увидеть подробности.',w:'next'},
 {sel:'.menu',t:'Внизу — продукт, команда, финансы и инсайты: ступени продукта, найм, ипотека и мечты. Дальше — сами. Удачи!',w:'next'}
];
function tutDone(){S.tut=99;try{localStorage.setItem('putkreatora_tut','done')}catch(e){}}
function tutTick(){
 document.querySelectorAll('.coachT').forEach(x=>x.classList.remove('coachT'));
 const old=$('#coach');if(old)old.remove();
 if(!S||S.over||S.tut===undefined||S.tut>=TUT.length)return;
 const st=TUT[S.tut];
 if(st.sel==='.hk'&&!document.querySelector('.hk')){S.tut=0;return tutTick()}
 if(modalOpen&&st.sel!=='.hk')return;
 if(document.querySelector('#sheet'))return;
 const t=document.querySelector(st.sel);if(!t)return;
 t.classList.add('coachT');
 const r=t.getBoundingClientRect(),H=window.innerHeight||700;
 const b=document.createElement('div');b.id='coach';
 b.innerHTML=`<div class="cT">${st.t}</div><div class="cB"><button data-tut="skip">Пропустить обучение</button>${st.w==='next'?'<button data-tut="next" class="cN">Дальше</button>':''}</div>`;
 if(r.top>H/2)b.style.bottom=(H-r.top+10)+'px';else b.style.top=(r.bottom+10)+'px';
 document.body.appendChild(b);
}
document.addEventListener('click',e=>{
 if(!S||S.tut>=TUT.length)return;
 const tb=e.target.closest('[data-tut]');
 if(tb){e.stopPropagation();if(tb.dataset.tut==='skip')tutDone();else{S.tut++;if(S.tut>=TUT.length)tutDone()}save();return setTimeout(tutTick,30)}
 const st=TUT[S.tut];
 if(st.w==='click'&&e.target.closest(st.sel)){S.tut++;if(S.tut>=TUT.length)tutDone();setTimeout(tutTick,80)}
},true);

/* ====== ЭФФЕКТЫ ====== */
function fx(kind){
 try{
  if(kind==='confetti'){
   const box=document.createElement('div');box.className='conf';
   const cols=['#8E7BFF','#FF6FA8','#2ED89B','#E8A020','#fff'];
   for(let i=0;i<46;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];
    c.style.animationDelay=(Math.random()*.35)+'s';c.style.animationDuration=(1.1+Math.random()*.9)+'s';c.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(c)}
   document.body.appendChild(box);setTimeout(()=>box.remove(),2400);
   haptic('success');
  }else if(kind==='shake'){
   const el=$('#numsEl');if(el){el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk')}
   haptic('heavy');
  }else if(kind==='glow'){
   const el=$('#chipsEl');if(el){el.classList.remove('glw');void el.offsetWidth;el.classList.add('glw')}
  }
 }catch(e){}
}
/* ====== ИТОГИ МЕСЯЦА ====== */
function monthTrack(k,title,views,q){const m=S.month;if(!m)return;m.posts++;m.q+=q;
 if(!m.best||views>m.best.v)m.best={t:title,v:views};
 if(!m.worst||views<m.worst.v)m.worst={t:title,v:views}}
function monthReport(){
 const s=S,m=s.month;if(!m)return;
 const n=Math.round((s.day-1)/30),subs=s.live+s.dead,gain=subs-m.subs,rev=s.revenue-m.rev;
 const cps=gain>0&&m.spent>0?Math.round(m.spent/gain):0,avgQ=m.posts?Math.round(m.q/m.posts):0;
 const ser=m.series.length>1?m.series:[m.subs,subs];const mx=Math.max(...ser),mn=Math.min(...ser);
 const pts=ser.map((v,i)=>`${(i/(ser.length-1)*100).toFixed(1)},${(38-(mx===mn?.5:(v-mn)/(mx-mn))*34).toFixed(1)}`).join(' ');
 let advice;
 if(m.posts<8)advice='Публикаций меньше двух в неделю — алгоритму не на чем учиться. Ритм важнее качества каждого ролика.';
 else if(avgQ<45)advice='Среднее качество ниже 45. Попробуйте хотя бы один «Сценарий» перед каждой публикацией.';
 else if(s.trust<35)advice='Подписчики есть, доверия мало. Сторис и карусели в следующем месяце дадут больше денег, чем новые охваты.';
 else if(rev<=0&&subs>800)advice='Аудитория есть, продаж нет. Прогрейте продающими и запустите продажу, пока прогрев выше 50.';
 else if(s.burn>60)advice='Выгорание выше 60. Следующий месяц начните с выходного и встречи с друзьями — иначе потеряете пять дней разом.';
 else advice='Сильный месяц. Проверьте, не пора ли подняться на следующую ступень продукта.';
 queue.push({e:'📊',t:`Итоги месяца ${n}`,d:`<svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:46px;display:block;margin:2px 0 10px"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
 <div class="grid2" style="margin-bottom:10px"><div><b>${gain>=0?'+':''}${fmt(gain)}</b><span>подписчиков за месяц</span></div><div><b>${fmt(rev)} ₽</b><span>заработано</span></div>
 <div><b>${m.posts}</b><span>публикаций, качество ${avgQ}</span></div><div><b>${cps?fmt(cps)+' ₽':'—'}</b><span>цена подписчика</span></div></div>
 ${m.best?`🏆 Лучший: «${m.best.t}» — ${fmt(m.best.v)}<br>`:''}${m.worst&&m.posts>1?`🥶 Худший: «${m.worst.t}» — ${fmt(m.worst.v)}<br>`:''}<br><b>Совет на месяц:</b> ${advice}`});
 s.month={subs,rev:s.revenue,spent:0,best:null,worst:null,posts:0,q:0,series:[subs]};
}
/* ====== ЧЕЛЛЕНДЖ И РЕКОРДЫ НА СТАРТЕ ====== */
function drawStartBtns(){
 const c=challengeSetup(),n=NICHE[c.fam].find(x=>x.id===c.nc);
 $('#chalBtn').innerHTML=`⚔️ Челлендж недели №${c.k}<small>${n.e} ${n.n} · ${STORIES[c.st].n} · ${TRAITS[c.trt].n}</small>`;
}
function startChallenge(){const c=challengeSetup();pickFam=c.fam;newGame(c.fam,c.nc,'normal','',c.trt,c.st,c.k)}
function showRecords(){
 const a=loadRecs().sort((x,y)=>(y.won-x.won)||(y.rev-x.rev)||(y.subs-x.subs));
 const wk=weekKey(),ch=a.filter(r=>r.ch===wk).sort((x,y)=>(y.won-x.won)||(y.rev-x.rev));
 const row=(r,i)=>`<div class="it"><div class="h"><span>${i+1}. ${r.e} ${r.name}</span><em>${r.won?'✓ '+r.wonDay+'-й день':r.day+' дн.'}</em></div>
  <div class="d">${r.rank}<br>${fmt(r.rev)} ₽ · ${fmt(r.subs)} подписчиков · ${STORIES[r.story]?STORIES[r.story].n.toLowerCase():''}${r.hc?' · выживание':''}${r.ch?' · челлендж №'+r.ch:''}</div></div>`;
 const body=`<div class="mo"><div class="em">🏆</div><h3>Мои рекорды</h3>
  ${a.length?'':'<p>Пока пусто. Закончите первую игру — результат появится здесь.</p>'}
  ${ch.length?`<h4>Челлендж этой недели</h4>${ch.slice(0,3).map(row).join('')}`:''}
  ${a.length?`<h4>Лучшие забеги</h4>${a.slice(0,10).map(row).join('')}`:''}
  <button class="btn g" data-c="x">Закрыть</button></div>`;
 const root=$('#ovRoot');root.innerHTML=`<div class="ov">${body}</div>`;
 root.onclick=e=>{const b=e.target.closest('button');if(b){root.innerHTML='';root.onclick=null}};
}

/* ====== СТАРТ ====== */
let pickFam=null,pickNiche=null,pickDiff=null,pickStory=null;
function drawStart(){
 const L=$('#archList');
 if(!pickFam){
  $('#startHint').textContent='Шаг 1. Чем вы зарабатываете?';
  L.innerHTML=Object.entries(FAM).map(([k,f])=>
   `<button class="archBtn" data-f="${k}"><span class="em">${f.e}</span><b>${f.name}</b><small>${f.desc} Цель: ${f.goalText.toLowerCase()}.</small></button>`).join('');
 }else{
  if(pickNiche&&pickStory&&pickDiff){
   $('#startHint').textContent='Шаг 5. Ваш характер';
   L.innerHTML=Object.entries(TRAITS).map(([k,t])=>`<button class="archBtn" data-tr="${k}"><span class="em">${t.e}</span><b>${t.n}</b><small>${t.d}</small></button>`).join('')
    +`<button class="wide ghost" data-back="1">Назад</button>`;
   return;
  }
  if(pickNiche&&pickStory){
   $('#startHint').textContent='Шаг 4. Уровень сложности';
   L.innerHTML=Object.entries(DIFF).map(([k,d])=>`<button class="archBtn" data-d="${k}"><span class="em">${d.e}</span><b>${d.n}</b><small>${d.d}</small></button>`).join('')
    +`<button class="wide ghost" data-back="1">Назад</button>`;
   return;
  }
  if(pickNiche){
   $('#startHint').textContent='Шаг 3. С чего всё началось';
   L.innerHTML=Object.entries(STORIES).map(([k,t])=>`<button class="archBtn" data-st="${k}"><span class="em">${t.e}</span><b>${t.n}</b><small>${t.d}</small></button>`).join('')
    +`<button class="wide ghost" data-back="1">Назад</button>`;
   return;
  }
  $('#startHint').textContent='Шаг 2. Ваша профессия';
  L.innerHTML=NICHE[pickFam].map(n=>
   `<button class="archBtn" data-n="${n.id}"><span class="em">${n.e}</span><b>${n.n}</b><small>${n.d}</small></button>`).join('')
   +`<button class="wide ghost" data-back="1">Назад</button>`;
 }
}
$('#archList').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.back){if(pickDiff)pickDiff=null;else if(pickStory)pickStory=null;else if(pickNiche)pickNiche=null;else pickFam=null;return drawStart()}
 if(b.dataset.st){pickStory=b.dataset.st;return drawStart()}
 if(b.dataset.f){pickFam=b.dataset.f;return drawStart()}
 if(b.dataset.n){pickNiche=b.dataset.n;return drawStart()}
 if(b.dataset.d){pickDiff=b.dataset.d;return drawStart()}
 if(b.dataset.tr){newGame(pickFam,pickNiche,pickDiff,'',b.dataset.tr,pickStory)}};
drawStart();drawStartBtns();
$('#chalBtn').onclick=startChallenge;$('#recBtn').onclick=showRecords;
$('#game').onclick=e=>{
 if(!S||modalOpen)return;
 const sh=e.target.closest('[data-sheet]');
 if(sh)return reopen(sh.dataset.sheet);
 const i=e.target.closest('[data-info]');
 if(i)return reopen('info');
 const c=e.target.closest('[data-help]');
 if(c){const H=HELP[c.dataset.help];msg(H[0],H[1],H[2]);flush()}
};
$('#actsEl').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled){haptic('tap');act(b.dataset.act)}};
$('#tabsEl').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.act)return act('rest');tab=b.dataset.tab;render()};
$('.menu').onclick=e=>{const b=e.target.closest('button');if(b&&S&&!modalOpen)reopen(b.dataset.sheet)};
function offerContinue(sv){if(!sv||sv.over)return;$('#contBtn').classList.remove('hidden');
 $('#contBtn').onclick=()=>{S=sv;week=WEEKS.find(w=>w.id===S.weekId)||WEEKS[8];showGame();render()}}
const sv=load();
if(sv&&!sv.over)offerContinue(sv);
else cloudGet('game',str=>{try{const c=str&&JSON.parse(str);if(c&&!c.over){localStorage.setItem(SAVE,str);offerContinue(c)}}catch(e){}});
if(!loadRecs().length)cloudGet('recs',str=>{try{if(str)localStorage.setItem(REC,str)}catch(e){}});
})();
</script>
